name: Simple UDF CI

on: [push, pull_request]

env:
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  CATALOG_NAME: ${{ secrets.CATALOG_NAME }}
  SCHEMA_NAME: ${{ secrets.SCHEMA_NAME }}
  WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}

jobs:
  test-and-register:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Install test dependencies
      run: pip install -r temporals/test/requirements.txt

    - name: Run test suite
      run: |
        echo "Running test harness..."
        pytest temporals/test/ --maxfail=1 --disable-warnings --tb=short

    - name: Verify connectivity
      run: databricks workspace list

    - name: Register SQL UDFs
      if: success()
      run: |
        databricks sql query \
          --warehouse-id $WAREHOUSE_ID \
          --query-file temporals/core/register_udfs.sql \
          --parameters catalog_name=$CATALOG_NAME schema_name=$SCHEMA_NAME
