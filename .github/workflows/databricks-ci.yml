name: Simple UDF CI

on: [push, pull_request]

env:
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}
  WAREHOUSE_HTTP_PATH: ${{ secrets.WAREHOUSE_HTTP_PATH }}
  WORKSPACE_REPO_PATH: ${{ secrets.WORKSPACE_REPO_PATH }}
  WORKSPACE_REPO_ID: ${{ secrets.WORKSPACE_REPO_ID }}
  WORKSPACE_VOLUME_PATH: ${{ secrets.WORKSPACE_VOLUME_PATH }}
  CATALOG_NAME: ${{ secrets.CATALOG_NAME }}
  SCHEMA_NAME: ${{ secrets.SCHEMA_NAME }}
  WHEEL_NAME: "terabricks_temporals-0.0.1-py3-none-any.whl"

jobs:
  test-and-register:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Get pip up to date
      run: pip install --upgrade pip

    - name: Install test dependencies
      run: pip install -r temporals/test/requirements.txt

    - name: Run test suite
      run: |
        echo "Running test harness..."
        pytest temporals/test/ --maxfail=1 --disable-warnings --tb=short

    - name: Install Databricks CLI
      uses: databricks/setup-cli@main

    - name: Verify connectivity
      run: databricks workspace list /

    - name: Install build dependencies
      run: pip install build

    - name: Build python wheel
      run: python -m build --wheel

    - name: Inspect wheel contents
      run: unzip -l "dist/$WHEEL_NAME"

    - name: Deploy python wheel
      run: databricks fs cp "dist/$WHEEL_NAME" "$WORKSPACE_VOLUME_PATH/$WHEEL_NAME" --overwrite

    - name: Sync databricks repo folders
      run: databricks repos update $WORKSPACE_REPO_ID --branch main

#    - name: Help
#      run: databricks volumes --help

#    - name: Where am I
#      run: pwd

#    - name: What is local
#      run: ls -la temporals/dist

#    - name: What is remote
#      run: databricks volumes list workspace funlib

    - name: var subs for udf registration
      run: sed "s|__WHEEL_PATH__|${wheel_path}|g" temporals/core/register_udfs.sql > temporals/temp/register_udfs.sql

    - name: What is local
      run: |
        ls -la 
        ls -la temporals
        ls -la temporals/temp

    - name: Submit Job Inline
      run: |
        databricks jobs submit --json "{
          \"run_name\": \"CI Notebook Run\",
          \"tasks\": [{
            \"task_key\": \"Launch_Notebook\",
            \"notebook_task\": {
              \"notebook_path\": \"$WORKSPACE_REPO_PATH/terabricks/temporals/temp/register_udfs.sql\",
              \"warehouse_id\": \"$WAREHOUSE_ID\",
              \"base_parameters\": {
                \"env\": \"ci\",
                \"catalog_name\": \"$CATALOG_NAME\",
                \"schema_name\": \"$SCHEMA_NAME\",
                \"wheel_name\": \"$WHEEL_NAME\"
              }
            }
          }]
        }"

    #- name: Run SQL
    #  continue-on-error: true
    #  run: bash .github/workflows/databricks-ci.sh temporals/core/register_udfs.sql

      #      run: dbsqlcli --clirc temporals/core/.dbsqlclirc -e temporals/core/register_udfs.sql --hostname $DATABRICKS_HOST --http-path $WAREHOUSE_HTTP_PATH --access-token $DATABRICKS_TOKEN --catalog_name="workspace"

